<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>おうちピザレシピ</title>

  <!-- CSS -->

  <link rel="stylesheet" href="./CSS/style.css">

  <!-- JavaScript -->
  <script src="./js/script.js" defer></script>
</head>

<body>

  <!--ヘッダー-->
  <header class="header">

    <h1 class="logo">
      <a href="index.html">
        ホームへ
      </a>
    </h1>

    <div class="header-right">

      <!-- 料理を探すページ -->
        <a href="search.html" class="search-link">
      料理を探す
    </a>

      <!-- 料理名検索 -->
      <form class="search-form" id="search-form">

        <input
          type="search"
          id="recipe-search"
          placeholder="料理名で検索"
        >

        <button type="submit">
          検索
        </button>

      </form>

      <!-- ダークモード -->
      <button
        type="button"
        class="dark-mode-button"
        id="dark-mode-button"
      >
        🌙
      </button>

    </div>

  </header>


  <!--メイン-->
  <main>

    <section class="recommend">

      <div class="container">

        <div class="heading-group">

          <h2>
            おすすめピザ
          </h2>

          <p>
            自宅で作れるおすすめのピザを紹介します
          </p>

        </div>


        <!--JavaScriptで料理カードを生成-->
        <ul
          class="recipe-list"
          id="recipe-list"
        >
        </ul>


        <div class="more-button">

          <a href="search.html">
            料理をもっと見る
          </a>

        </div>

      </div>

    </section>

  </main>


  <!--フッター-->
  <footer class="footer">

    <nav>

      <ul class="footer-nav">

        <li>
          <a href="index.html">
            ホーム
          </a>
        </li>

        <li>
          <a href="search.html">
            料理を探す
          </a>
        </li>

        <li>
          <a href="contact.html">
            お問い合わせ
          </a>
        </li>

      </ul>

    </nav>

    <p class="copyright">
      &copy; 2026 おうちピザレシピ
    </p>

  </footer>

</body>

</html>
