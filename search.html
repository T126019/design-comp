<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>料理を探す | おうちピザレシピ</title>

  <!-- CSS -->

  <link rel="stylesheet" href="./CSS/style.css">

  <!-- JavaScript -->
  <script src="./js/script.js" defer></script>
</head>

<body>

  <!--ヘッダー-->
  
  <header class="header">

    <h1 class="logo">
      <a href="index.html">
        ホーム
      </a>
    </h1>

    <div class="header-right">

      <a href="search.html" class="search-link">
        料理を探す
      </a>

      <!-- ダークモード -->
      <button
        type="button"
        class="dark-mode-button"
        id="dark-mode-button">
        🌙
      </button>
    </div>
  </header>

  <!--メイン-->
  
  <main class="search-main">

    <section class="search-section">

      <div class="container">

        <!-- ページタイトル -->
        <div class="heading-group">

          <h2>料理を探す</h2>

          <p>
            料理名や材料から作りたいピザを探せます
          </p>
        </div>

        <!--料理名検索-->
        
        <div class="search-box">

          <h3>料理名から探す</h3>

          <form
            class="search-page-form"
            id="search-page-form">

            <input
              type="search"
              id="search-page-input"
              placeholder="例：マルゲリータ">

            <button type="submit">
              検索
            </button>
          </form>
        </div>

        <!--材料検索-->
        
        <div class="filter-box">

          <h3>材料から絞り込む</h3>

          <p>
            使いたい材料を選んでください
          </p>

          <div class="ingredient-filter">

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="トマト">
              トマト
            </label>

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="モッツァレラチーズ">
              モッツァレラチーズ
            </label>

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="バジル">
              バジル
            </label>

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="チーズ">
              チーズ
            </label>

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="にんにく">
              にんにく
            </label>

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="鶏肉">
              鶏肉
            </label>

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="コーン">
              コーン
            </label>

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="マヨネーズ">
              マヨネーズ
            </label>

            <label>
              <input
                type="checkbox"
                class="ingredient-checkbox"
                value="蜂蜜">
              蜂蜜
            </label>
          </div>

          <!-- 絞り込みボタン -->
          <div class="filter-buttons">

            <button
              type="button"
              id="filter-button">
              この条件で絞り込む
            </button>

            <button
              type="button"
              id="reset-button">
              条件をリセット
            </button>
          </div>
        </div>

        <!--検索結果-->
        
        <section class="search-result">

          <div class="heading-group">

            <h2>検索結果</h2>
          </div>

          <!-- JavaScriptで料理を表示 -->
          <ul
            class="recipe-list"
            id="search-result-list">
          </ul>
        </section>
      </div>
    </section>
  </main>

  <!--フッター-->
  
  <footer class="footer">

    <nav>

      <ul class="footer-nav">

        <li>
          <a href="index.html">
            ホーム
          </a>
        </li>

        <li>
          <a href="search.html">
            料理を探す
          </a>
        </li>

        <li>
          <a href="contact.html">
            お問い合わせ
          </a>
        </li>
      </ul>
    </nav>

    <p class="copyright">
      &copy; 2026 おうちピザレシピ
    </p>
  </footer>
</body>
</html>
